name: Build DubRack

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --target DubRack_VST3 --parallel
      - name: Upload VST3
        uses: actions/upload-artifact@v5
        with:
          name: DubRack-Windows-VST3
          path: build/DubRack_artefacts/Release/VST3/DubRack.vst3

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -G Xcode
      - name: Build
        run: cmake --build build --config Release --target DubRack_VST3 --parallel
      - name: Upload VST3
        uses: actions/upload-artifact@v5
        with:
          name: DubRack-macOS-VST3
          path: build/DubRack_artefacts/Release/VST3/DubRack.vst3
